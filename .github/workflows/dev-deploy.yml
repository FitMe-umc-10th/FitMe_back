# Workflow 이름
name: Fit-me dev deploy

# 워크플로우 권한 부여
permissions:
  contents: read

# 어떤 이벤트가 발생하면 workflow 실행할 지 명시
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

# 위 이벤트 발생 시 실행될 작업들
jobs:
  build:
    # VM의 실행 환경 지정 => 우분투 최신 버전
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'

    steps:

      # 1. 깃허브 소스코드와 Dockerfile을 복사
      - name: Checkout
        uses: actions/checkout@v7

      # 2. JDK 21 설치 (adopt -> temurin으로 수정)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle Build를 위한 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Gradle Build (test 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. DockerHub 로그인
      - name: DockerHub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Docker 이미지 빌드 (Dockerfile 기반)
      - name: Docker Image Build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest .

      # 7. DockerHub Push
      - name: DockerHub Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

      # 8. docker-compose.yml 파일을 EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}"

      # 9. EC2 인스턴스 접속 및 애플리케이션 실행
      - name: Application Run
        uses: appleboy/ssh-action@master
        env: # Github Secrets에서 환경변수 파일을 가져옴
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          PORT: ${{ secrets.PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          envs: ENV_FILE, DOCKERHUB_USERNAME, PROJECT_NAME, PORT
          script: |
            # 1. 환경변수를 .env 파일로 저장
            echo "$ENV_FILE" > .env
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" >> .env
            echo "PROJECT_NAME=$PROJECT_NAME" >> .env
            echo "PORT=$PORT" >> .env
            
            #2. 도커 이미지 다운로드
            sudo docker compose pull
            
            # 3. 기존 컨테이너 중지 및 docker-compose 기반 새 컨테이너 백그라운드 실행
            sudo docker compose up -d
            
            # 4. 사용하지 않는 구버전 도커 이미지 정리 (EC2 용량 관리용)
            sudo docker image prune -f