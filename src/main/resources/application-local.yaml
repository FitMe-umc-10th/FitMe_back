spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # Hibernate가 실행한 SQL 쿼리를 콘솔에 출력
    properties: # 출력된 SQL 쿼리를 읽기 쉽게 정렬
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
          kakao:
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao

app:
  oauth2:
    redirect-uri: http://localhost:5173/test.html
    failure-redirection-uri: http://localhost:5173/login

logging:
  level:
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) [%thread] [%X{traceId:-}] [%X{userId:-anonymous}] %logger{36} - %msg%n"
