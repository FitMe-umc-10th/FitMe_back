spring:
  application:
    name: fitme
  profiles:
    active: local # 기본 실행 프로파일

  # 사용할 DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 소셜 로그인
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - birthday
              - birthyear

          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # Authorization Server 서비스 로그인창 주소
            token-uri: https://nid.naver.com/oauth2.0/token # Authorization Server 토큰 교환 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me #Resource Server
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true # SMTP 서버에 인증해야 하는 경우 true로 지정(Gmail은 필수)
          starttls: # TLS = 데이터를 암호화해 안전한 전송을 보장하는 프로토콜
            enable: true
            require: true
          response-timeout: 5000 # 클라이언트가 SMTP 서버로부터 응답 대기해야 하는 시간 (msec)
          connection-timeout: 5000 # 클라이언트가 SMTP 서버와 연결하는 시간 (msec)
          write-timeout: 5000 # 클라이언트가 SMTP 서버로부터 응답 대기애햐 하는 시간 (msec)

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000 # 30분
  refresh-token-validity: 1209600000 # 14일