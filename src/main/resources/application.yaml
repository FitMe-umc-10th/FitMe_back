spring:
  application:
    name: fitme
  profiles:
    active: local # 기본 실행 프로파일

  # 사용할 DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 소셜 로그인
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - birthday
              - birthyear

          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
              - birthday
              - birthyear

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # Authorization Server 서비스 로그인창 주소
            token-uri: https://nid.naver.com/oauth2.0/token # Authorization Server 토큰 교환 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me #Resource Server
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true # SMTP 서버에 인증해야 하는 경우 true로 지정(Gmail은 필수)
          starttls: # TLS = 데이터를 암호화해 안전한 전송을 보장하는 프로토콜
            enable: true
            require: true
          response-timeout: 5000 # 클라이언트가 SMTP 서버로부터 응답 대기해야 하는 시간 (msec)
          connection-timeout: 5000 # 클라이언트가 SMTP 서버와 연결하는 시간 (msec)
          write-timeout: 5000 # 클라이언트가 SMTP 서버로부터 응답 대기애햐 하는 시간 (msec)

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  task:
    scheduling:
      # 기본값(1)이면 앱의 모든 @Scheduled 작업이 스레드 1개를 공유해서,
      # 하나가 오래 걸리거나 멈추면 나머지 스케줄러가 전부 밀리거나 실행되지 않는다.
      pool:
        size: 5

cloud:
  aws:
    s3:
      bucket: fitme-image-bucket-200377818137-ap-northeast-2-an
    region:
      static: ap-northeast-2
    stack:
      auto: false # 로컬 실행 시 불필요한 CloudFormation 에러 방지

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000 # 30분
  refresh-token-validity: 1209600000 # 14일

scholarship:
  sync:
    # publicDataPk는 data.go.kr 파일데이터 ID로, 비밀값이 아니라 기본값을 둔다.
    # (15028252 = 한국장학재단_학자금지원정보(대학생)). 실제 조회 엔드포인트는 매달 바뀌므로
    # ScholarshipOpenApiEndpointResolver가 실행 시점마다 최신 엔드포인트를 다시 찾는다.
    public-data-pk: ${SCHOLARSHIP_SYNC_PUBLIC_DATA_PK:15028252}
    # service-key가 없어도(:뒤 기본값 없음) 앱이 죽지 않도록 빈 문자열 기본값을 둔다.
    # 실제 동기화는 ScholarshipApiClient에서 비어있으면 건너뛰도록 가드한다.
    service-key: ${SCHOLARSHIP_SYNC_SERVICE_KEY:} # 공공데이터포털 발급 인증키

    # 값이 없어도(:뒤 기본값 없음) 앱이 죽지 않도록 빈 문자열 기본값을 둔다.
    # 실제 동기화는 ScholarshipSyncService에서 비어있으면 건너뛰도록 가드한다.
    csv-url: ${SCHOLARSHIP_SYNC_CSV_URL:} # 공공데이터포털 한국장학재단 학자금지원정보 파일데이터 URL
    csv-charset: EUC-KR # 공공데이터 CSV는 EUC-KR인 경우가 많음 (실제 파일 확인 후 필요 시 UTF-8로 변경)

public-data:
  api-key: ${PUBLIC_DATA_API_KEY}
  url: ${PUBLIC_DATA_URL}

openai:
  # 값이 없어도(:뒤 기본값 없음) 앱이 죽지 않도록 빈 문자열 기본값을 둔다.
  # 실제 요약 생성은 OpenAiSummaryClient에서 비어있으면 건너뛰도록 가드한다.
  api-key: ${OPENAI_API_KEY:}
  api-url: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini

